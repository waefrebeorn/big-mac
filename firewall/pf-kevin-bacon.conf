#
# Big Mac Firewall — Kevin Bacon Trust Graph + Packet Filter
# iMac14,4 | macOS 11.7.9 | waefrebeorn
#
# Philosophy: "Six Degrees of Trust"
#   - Apple root of trust (signed system binaries) = degree 0
#   - Apple user apps (Safari, Mail, etc) = degree 1
#   - Your signed/dev apps (Xcode, Homebrew, etc) = degree 2
#   - Anything you explicitly allow = degree 3
#   - Unknown/untrusted = BLOCKED
#
# Packet layer (pf): default deny inbound, allow established outbound,
# rate-limit brute force, block bogons, stealth from sweeps.
#
# pf rule order MUST be: options, normalization, queueing, translation, filtering
#

# ─── Macros ───────────────────────────────────────────────────────────
ext_if = "en1"        # Wi-Fi (primary on this iMac)

# ─── Tables ────────────────────────────────────────────────────────────
table <apple_trust> persist { 17.0.0.0/8, 23.0.0.0/8, 104.156.80.0/20 }
table <bruteforce> persist
table <scanners> persist
table <bogons> persist { \
    0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, \
    169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, \
    192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, \
    224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32 }

# ─── Options ───────────────────────────────────────────────────────────
set skip on lo0
set block-policy drop
set loginterface en1
set optimization aggressive

# ─── Normalization ─────────────────────────────────────────────────────
scrub in all fragment reassemble
scrub out all random-id

# ─── Translation ───────────────────────────────────────────────────────
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"

# ─── Filtering ─────────────────────────────────────────────────────────

# Block known bad actors immediately
block drop quick from <bruteforce> to any
block drop quick from <scanners> to any

# Anti-sweep: block bogons on external interface
block drop in quick on $ext_if from <bogons> to any
block drop out quick on $ext_if from any to <bogons>

# Kevin Bacon degree 0: Apple system traffic
pass in quick on $ext_if from <apple_trust> to any flags S/SA keep state

# Kevin Bacon degree 1: LAN (your home network is trusted)
pass in quick on $ext_if from 192.168.1.0/24 to any
pass out quick on $ext_if from any to 192.168.1.0/24

# Anti-bruteforce: SSH from LAN only, rate-limited
pass in quick on $ext_if inet proto tcp from 192.168.1.0/24 to any port 22 \
    flags S/SA keep state \
    (max-src-conn 5, max-src-conn-rate 3/10, \
     overload <bruteforce> flush global)

# SSH from anywhere else = instant block
block drop in quick on $ext_if inet proto tcp from any to any port 22

# Anti-scan: rate limit new TCP connections per source (catches fast scanners)
pass in on $ext_if inet proto tcp to any port { 80 443 8080 8443 } \
    flags S/SA keep state \
    (max-src-conn 50, max-src-conn-rate 20/5, \
     overload <scanners> flush global)

# Outbound: DNS
pass out quick on $ext_if proto { tcp udp } from any to any port 53

# Outbound: HTTP/HTTPS (Friendly Netflix, browsing)
pass out quick on $ext_if inet proto tcp from any to any port { 80 443 }

# Outbound: NTP (time sync)
pass out quick on $ext_if proto udp from any to any port 123

# Outbound: ICMP (ping out only — stealth for inbound)
pass out quick on $ext_if inet proto icmp all icmp-type { echoreq, unreach }

# Outbound: dev/DAW (git, homebrew, hermes updates)
pass out quick on $ext_if inet proto tcp from any to any port { 9418 22 }

# Default deny (with logging)
block drop in log all
block drop out log all

# Load Apple's anchor (system services) — must be last
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"
